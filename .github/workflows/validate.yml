name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        include:
          - homeassistant: '2026.1.0'
            python: '3.13'
          - homeassistant: '2026.11.0'
            python: '3.14'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install sgp4==2.25 homeassistant==${{ matrix.homeassistant }}
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --check almanac-sky-card.js
      - run: node verify-day.cjs
      - run: node tests/verify-backend.cjs
      - run: node tests/verify-home-link.cjs
      - run: node tests/verify-themes.cjs
      - run: cmp almanac-sky-card.js custom_components/almanac/www/almanac-sky-card.js
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          github_token: ${{ secrets.GITHUB_TOKEN }}
